name: Publish validated version

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Tests and Ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Inspect exact BX Plus 2.08 RPT metadata (temporary development evidence)
        if: matrix.python-version == '3.13'
        continue-on-error: true
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile, hashlib, xml.etree.ElementTree as ET
          url = "https://www.mastersolar.rs/wp-content/uploads/2021/02/BXPLUS_2.08.zip"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as response:
              data = response.read(4000000)
          print("RPT ZIP sha256:", hashlib.sha256(data).hexdigest())
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              print("Device definition:", archive.read("BXPLUS_2.08/bxplus_208.xml").decode("utf-8-sig", errors="replace"))
              root = ET.fromstring(archive.read("BXPLUS_2.08/BXPlus_208-Menu.xml"))
              print("ROOT", root.tag, root.attrib)
              for elem in root.iter():
                  ident = elem.get("id", "")
                  if (elem.tag == "type" and ("Handbetrieb" in ident and ("{0}" in ident or ident == "Handbetrieb"))) or (elem.tag == "value" and (ident in ("Softwareversion", "Schema", "ShortChangesetId") or (ident.startswith("Relais_Regler_R") and (ident.endswith("_Handbetrieb") or ident.endswith("_Status") or ident.endswith("_Verfuegbar"))))) or (elem.tag == "mask" and "Verfuegbar" in str(elem.attrib) and "Relais" in str(elem.attrib)):
                      print("META", ET.tostring(elem, encoding="unicode")[:10000])
          PY
      - name: Regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration

  publish:
    name: Publish version and HACS artifact
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      startsWith(github.event.head_commit.message, 'release:')
    needs:
      - test-and-lint
      - validate-hassfest
      - validate-hacs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deltasol-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish only a validated, not-yet-released dev version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/deltasol/manifest.json", encoding="utf-8"))["version"])')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric x.y.z version, got $VERSION"
            exit 1
          fi

          # An older workflow run must not publish from an outdated dev.
          DEV_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq '.commit.sha')"
          if [[ "$DEV_SHA" != "$GITHUB_SHA" ]]; then
            echo "Dev advanced since this run started; skip stale release."
            exit 0
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $VERSION is already published; nothing to do."
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists without a release; refusing to overwrite."
            exit 1
          fi

          PACKAGE="$RUNNER_TEMP/deltasol.zip"
          (cd custom_components/deltasol && zip -qr "$PACKAGE" . -x '*__pycache__*' '*.pyc')
          unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)manifest.json$'
          unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)sensor.py$'

          gh release create "$VERSION" "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeltaSol $VERSION" \
            --generate-notes
          echo "Published $VERSION with deltasol.zip for HACS."

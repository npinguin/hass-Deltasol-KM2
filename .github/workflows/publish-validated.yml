name: Publish validated version

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Tests and Ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Inspect exact RPT module and mode metadata (temporary)
        if: matrix.python-version == '3.13'
        run: |
          python - <<'PY'
          import io, hashlib, urllib.request, zipfile, xml.etree.ElementTree as ET
          req = urllib.request.Request("https://www.mastersolar.rs/wp-content/uploads/2021/02/BXPLUS_2.08.zip", headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read(4000000)
          print("RPT SHA", hashlib.sha256(data).hexdigest())
          assert hashlib.sha256(data).hexdigest() == "1bcc59cac3d4176c68de255fced3b95840bada06db33b0bdae0cddb007a9f079"
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              root = ET.fromstring(z.read("BXPLUS_2.08/BXPlus_208-Menu.xml"))
          for e in root.iter():
              ident = e.get("id", "")
              if e.tag == "value" and ("Handbetrieb" in ident or (ident.startswith("Relais_Regler_R") and ident.endswith("_ODrehzahl")) or ("Modul" in ident and any(x in ident for x in ("Aktiv", "Status", "Erkannt", "Verf", "Anmeld", "Adresse", "Relais", "Vorhand")))):
                  if "Heizung" not in ident and "Funktion" not in ident:
                      print("VALUE", ET.tostring(e, encoding="unicode")[:1600])
              if e.tag == "type" and ("Handbetrieb" in ident or "ModulX_Vt" in ident or "Relais_Vt" in ident):
                  print("TYPE", ET.tostring(e, encoding="unicode")[:4000])
              if e.tag in ("mask", "constraint") and ("Relais_Regler_R1" in str(e.attrib) or "Relais_Regler_R4" in str(e.attrib) or "Relais_Modul1_R1" in str(e.attrib) or "Handbetrieb" in ET.tostring(e, encoding="unicode")):
                  print("MENU", ET.tostring(e, encoding="unicode")[:5000])
          PY
      - name: Regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration

  qualify-ha:
    name: Qualify actual HA lifecycle and packaged bytes
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      startsWith(github.event.head_commit.message, 'release:'))
    needs: [test-and-lint, validate-hassfest, validate-hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.11.0
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Assemble and qualify candidate, upgrade and rollback
        shell: bash
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/deltasol-qualification"
          mkdir -p "$Q/config/custom_components/deltasol" "$Q/rollback"
          PACKAGE="$Q/deltasol.zip"
          (cd custom_components/deltasol && zip -qr "$PACKAGE" . -x '*__pycache__*' '*.pyc')
          zip -j "$PACKAGE" LICENSE
          unzip -t "$PACKAGE"
          unzip -Z1 "$PACKAGE" | grep -Fx select.py
          unzip -Z1 "$PACKAGE" | grep -Fx diagnostics.py
          unzip -Z1 "$PACKAGE" | grep -Fx VBUS-LICENSE.txt
          gh release download 1.2.6 --repo "$GITHUB_REPOSITORY" --pattern deltasol.zip --dir "$Q/rollback"
          sha256sum "$PACKAGE" "$Q/rollback/deltasol.zip"
          docker pull "$HA_IMAGE"
          install_zip() {
            rm -rf "$Q/config/custom_components/deltasol"
            mkdir -p "$Q/config/custom_components/deltasol"
            unzip -q "$1" -d "$Q/config/custom_components/deltasol"
          }
          run_phase() {
            timeout 180 docker run --rm --entrypoint python3 \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -v "$Q/config:/qualification" \
              -v "$GITHUB_WORKSPACE/tests/qualify_ha.py:/qualify.py:ro" \
              "$HA_IMAGE" /qualify.py /qualification "$1"
          }
          install_zip "$Q/rollback/deltasol.zip"
          run_phase baseline
          install_zip "$PACKAGE"
          run_phase upgrade
          run_phase restart
          install_zip "$Q/rollback/deltasol.zip"
          run_phase rollback
          (cd "$Q" && sha256sum deltasol.zip > deltasol.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-deltasol
          path: |
            ${{ runner.temp }}/deltasol-qualification/deltasol.zip
            ${{ runner.temp }}/deltasol-qualification/deltasol.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish version and HACS artifact
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      startsWith(github.event.head_commit.message, 'release:')
    needs:
      - test-and-lint
      - validate-hassfest
      - validate-hacs
      - qualify-ha
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deltasol-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: qualified-deltasol
          path: ${{ runner.temp }}/qualified-deltasol
      - name: Publish only a validated, not-yet-released dev version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/deltasol/manifest.json", encoding="utf-8"))["version"])')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric x.y.z version, got $VERSION"
            exit 1
          fi

          # An older workflow run must not publish from an outdated dev.
          DEV_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq '.commit.sha')"
          if [[ "$DEV_SHA" != "$GITHUB_SHA" ]]; then
            echo "Dev advanced since this run started; skip stale release."
            exit 0
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $VERSION is already published; nothing to do."
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists without a release; refusing to overwrite."
            exit 1
          fi

          PACKAGE="$RUNNER_TEMP/qualified-deltasol/deltasol.zip"
          (cd "$RUNNER_TEMP/qualified-deltasol" && sha256sum -c deltasol.zip.sha256)
          unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)manifest.json$'
          unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)sensor.py$'

          gh release create "$VERSION" "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeltaSol $VERSION TEST" \
            --prerelease \
            --notes "TEST: local BX Plus relay modes (Auto/Off/On) and capability discovery and native redacted diagnostics. Configure the separate VBus remote-access password. Existing telemetry retained. Isolated HA lifecycle and loopback protocol checks passed; physical RESOL acceptance remains open. Manual overrides may persist; restore Auto after safe supervised tests. Do not test on a hot solid-fuel installation."
          echo "Published $VERSION with deltasol.zip for HACS."

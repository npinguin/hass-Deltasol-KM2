name: Debug format difference

on:
  push:
    branches:
      - fix/missing-vbus-endpoints

jobs:
  show-ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show required Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --diff tests/test_sensor_regression.py"
